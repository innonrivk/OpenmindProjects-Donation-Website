services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omp_user
      POSTGRES_PASSWORD: omp_dev_password
      POSTGRES_DB: omp_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp_user -d omp_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omp-net

  # ── PgBouncer Connection Pooler ───────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: omp-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://omp_user:omp_dev_password@postgres:5432/omp_database
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    networks:
      - omp-net

  # ── Backend API ──────────────────────────────────────────────────────────────
  server:
    image: innon15/omp-server:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: omp-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://omp_user:omp_dev_password@pgbouncer:6432/omp_database
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - omp-net

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────────
  client:
    image: innon15/omp-client:latest
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: https://ompdonation-donation-back.ra1zsf.easypanel.host/api/v1
    container_name: omp-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - omp-net

volumes:
  postgres_data:
    driver: local

networks:
  omp-net:
    driver: bridge
