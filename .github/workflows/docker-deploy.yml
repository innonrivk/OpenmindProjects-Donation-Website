name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: innon15/omp-server:latest
          
      - name: Build and push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: innon15/omp-client:latest
          build-args: |
            VITE_API_URL=https://ompdonation-donation-back.ra1zsf.easypanel.host/api/v1
            VITE_GOOGLE_CLIENT_ID=205483244176-kmvmn335idvsdqjrnbafcu80kin5gr15.apps.googleusercontent.com
