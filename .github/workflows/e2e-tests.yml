name: E2E Tests
on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:       # Manual trigger

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: omp_user
          POSTGRES_PASSWORD: omp_dev_password
          POSTGRES_DB: omp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://omp_user:omp_dev_password@localhost:5432/omp_test
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm ci
      - run: cd client && npm ci
      - run: npx playwright install --with-deps chromium
      - run: cd server && npx prisma generate && npx prisma migrate deploy
      - run: cd server && node src/index.js &
      - run: cd client && npm run dev &
      - run: npx wait-on http://localhost:5173 http://localhost:3001/api/v1/health
      - run: cd client && npx playwright test
        env:
          TEST_GOOGLE_EMAIL: ${{ secrets.TEST_GOOGLE_EMAIL }}
          TEST_GOOGLE_PASSWORD: ${{ secrets.TEST_GOOGLE_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
